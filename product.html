lum promosi.</p></div>`;const related=catalog().filter(x=>x.id!==p.id).filter(x=>x.category!==p.category||p.category==='Aksesori').slice(0,4);document.querySelector('#completeLook').innerHTML=(related.length?related:catalog().filter(x=>x.id!==p.id)).slice(0,4).map(productCard).join('')}
